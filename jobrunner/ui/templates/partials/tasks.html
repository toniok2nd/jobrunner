{% if not run.tasks %}
<p class="muted">Tasks will appear here once the run starts.</p>
{% else %}
<table>
  <thead><tr><th>Task</th><th>Status</th><th>Duration</th><th>Error</th><th></th></tr></thead>
  <tbody>
  {% for t in run.tasks %}
    <tr>
      <td><code>{{ t.task_name }}</code></td>
      <td><span class="badge s-{{ t.status }}">{{ t.status }}</span></td>
      <td class="muted">{{ t.duration_seconds ~ "s" if t.duration_seconds is not none else "" }}</td>
      <td class="muted error-text">{{ t.error or "" }}</td>
      <td class="actions"><a href="/runs/{{ run.id }}?task={{ t.task_name }}">log</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
