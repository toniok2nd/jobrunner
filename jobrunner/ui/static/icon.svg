<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0e5fa8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- DAG edges (job graph) -->
  <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M22 18 L16 32"/>
    <path d="M26 20 L31 30"/>
    <path d="M17 40 L23 48"/>
    <path d="M34 37 L27 48"/>
  </g>

  <!-- DAG nodes -->
  <g fill="#ffffff">
    <circle cx="23" cy="14" r="5.5"/>
    <circle cx="14" cy="36" r="5"/>
    <circle cx="33" cy="32" r="5"/>
    <circle cx="24" cy="53" r="5"/>
  </g>
  <!-- node centers (accent) -->
  <g fill="#2563eb">
    <circle cx="23" cy="14" r="2"/>
    <circle cx="14" cy="36" r="1.8"/>
    <circle cx="33" cy="32" r="1.8"/>
    <circle cx="24" cy="53" r="1.8"/>
  </g>

  <!-- endpoint badge: lightning bolt (API trigger) -->
  <circle cx="48" cy="45" r="13" fill="#e8a13c" stroke="#0e5fa8" stroke-width="2.5"/>
  <path d="M50.5 36 L43 46.5 h4.4 L46 54.5 L54 42.5 h-4.4 L51.5 36 z" fill="#ffffff"/>
</svg>
