[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /srv/jobrunner/data --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=uvicorn jobrunner.main:app --host 0.0.0.0 --port 8080
directory=/srv/jobrunner
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A jobrunner.celery_app:celery worker --concurrency=2 --loglevel=INFO -Q jobs
directory=/srv/jobrunner
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
